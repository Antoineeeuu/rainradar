# Netlify : aucun build, on publie simplement le dossier « public ».
# Le relais temps réel Île-de-France est dans netlify/functions/idfm.mjs.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
